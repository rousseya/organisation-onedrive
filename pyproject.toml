[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-organizer"
version = "1.0.0"
description = "Classifie et organise automatiquement vos fichiers PDFs par catégorie en fonction de leur contenu"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "PDF Organizer", email = "info@pdfs.local" }
]
keywords = ["pdf", "organization", "classification", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pdfplumber>=0.10.0",
    "python-dotenv>=1.0.0",
    "mistralai>=0.0.11",
    "pdf2image>=1.17.0",
    "pypdf>=5.9.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
organize-pdfs = "src.organize_pdfs:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
managed = true

[tool.uv.sources]
# Add custom package sources here if needed

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
